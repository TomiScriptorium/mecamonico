name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'iconomecamonico.png'
      - 'capacitor.config.json'
      - 'android/**'
      - 'package.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El paquete legacy "tools" ya no existe en el repositorio del SDK
          # (Google lo eliminó); solo pedimos platform-tools, que sigue
          # disponible. Gradle descarga solo el resto (platform/build-tools)
          # según lo declarado en android/app/build.gradle.
          packages: "platform-tools"

      - name: Copiar la app web y sincronizar con Android
        run: npm run cap:sync
        env:
          # Se usa tal cual como versionCode/versionName más abajo y queda
          # empaquetado dentro del APK (www/build-info.json) para que la app
          # pueda compararse con la última compilación publicada en GitHub.
          MECAMONICO_BUILD_NUMBER: ${{ github.run_number }}

      - name: Poner un número de versión único para esta compilación
        working-directory: android/app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK generado (artifact del flujo)
        uses: actions/upload-artifact@v4
        with:
          name: Mecamonico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publicar el APK en una Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: "Mecamonico Android (última compilación)"
          # La app instalada lee el número de "build" de este texto (con una
          # expresión regular) para saber si hay una versión más nueva
          # disponible acá. Si se cambia la redacción, mantener el formato
          # "(build <número>)" tal cual.
          body: "APK generado automáticamente desde el commit ${{ github.sha }} (build ${{ github.run_number }}). Esta Release se actualiza sola en cada compilación nueva."
          files: android/app/build/outputs/apk/debug/app-debug.apk
