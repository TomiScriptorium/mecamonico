name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'iconomecamonico.png'
      - 'capacitor.config.json'
      - 'android/**'
      - 'package.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El paquete legacy "tools" ya no existe en el repositorio del SDK
          # (Google lo eliminó); solo pedimos platform-tools, que sigue
          # disponible. Gradle descarga solo el resto (platform/build-tools)
          # según lo declarado en android/app/build.gradle.
          packages: "platform-tools"

      - name: Copiar la app web y sincronizar con Android
        run: npm run cap:sync

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK generado (artifact del flujo)
        uses: actions/upload-artifact@v4
        with:
          name: Mecamonico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publicar el APK en una Release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: "Mecamonico Android (última compilación)"
          body: "APK generado automáticamente desde el commit ${{ github.sha }}. Esta Release se actualiza sola en cada compilación nueva."
          files: android/app/build/outputs/apk/debug/app-debug.apk
